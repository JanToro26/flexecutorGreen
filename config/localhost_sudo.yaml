# Localhost backend, for RAPL-capable runs.
#
#   LITHOPS_CONFIG_FILE=config/localhost_sudo.yaml python examples/energy_apps/run.py profile
#
# RAPL requires Linux, an Intel/AMD CPU exposing /sys/class/powercap, and read
# access to it (root-only since kernel 5.10):
#   sudo chmod -R a+r /sys/class/powercap/intel-rapl*
# Check with:
#   cat /sys/class/powercap/intel-rapl:0/name    -> package-0
#
# perf is opt-in via LITHOPS_ENERGY_PERF=1 and needs perf_event_paranoid <= 0.
# It measures the whole machine, so concurrent workers all report the same
# value; never sum them.

lithops:
    backend: localhost
    storage: localhost
    log_level: INFO

localhost:
    # runtime: python3
    # Windows: point at the venv interpreter instead, e.g.
    runtime: C:/Users/janto/Documents/TFG/Code/flexecutorGreen/.venv/Scripts/python.exe

    # Must be at least the largest worker count swept, otherwise invocations
    # serialise and the parallelism being profiled is not what ran. Keep it at
    # or below the physical core count.
    worker_processes: 8
